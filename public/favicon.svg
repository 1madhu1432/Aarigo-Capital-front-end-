<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f8f6"/>
      <stop offset="100%" stop-color="#e8f0dc"/>
    </radialGradient>
    <linearGradient id="aGreen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8fd44a"/>
      <stop offset="50%" stop-color="#6DA728"/>
      <stop offset="100%" stop-color="#4a7e1a"/>
    </linearGradient>
  </defs>

  <!-- White rounded square base -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bgWhite)"/>

  <!-- Outer green border ring -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#6DA728" stroke-width="2.5" opacity="0.6"/>

  <!-- Leaf-wreath circle halo (simplified) -->
  <circle cx="32" cy="30" r="22" stroke="#6DA728" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="5 3"/>

  <!-- Bold 3D "A" letterform -->
  <!-- Left leg -->
  <path d="M16 50 L32 12" stroke="url(#aGreen)" stroke-width="8" stroke-linecap="round"/>
  <!-- Right leg -->
  <path d="M32 12 L48 50" stroke="url(#aGreen)" stroke-width="8" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="22" y1="37" x2="42" y2="37" stroke="url(#aGreen)" stroke-width="6" stroke-linecap="round"/>

  <!-- Swoosh wave across the A (Aarigo signature mark) -->
  <path d="M12 40 Q24 34 36 37 Q44 40 52 35" stroke="#7cc72e" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M14 44 Q26 38 38 41 Q46 44 54 39" stroke="#5a9e1a" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Small leaf buds at corners for wreath feel -->
  <ellipse cx="20" cy="15" rx="3.5" ry="5.5" fill="#7cc72e" opacity="0.55" transform="rotate(-30 20 15)"/>
  <ellipse cx="44" cy="15" rx="3.5" ry="5.5" fill="#7cc72e" opacity="0.55" transform="rotate(30 44 15)"/>
  <ellipse cx="10" cy="32" rx="2.5" ry="4.5" fill="#6DA728" opacity="0.45" transform="rotate(-70 10 32)"/>
  <ellipse cx="54" cy="32" rx="2.5" ry="4.5" fill="#6DA728" opacity="0.45" transform="rotate(70 54 32)"/>
</svg>
